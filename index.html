<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <link rel="icon"
        type="image/png"
        sizes="32x32"
        href="./images/favicon-32x32.png">

  <title>Time tracking dashboard</title>
  <link rel="stylesheet"
        href="styles.css">

</head>

<body>

  <main>
    <div class="container">
      <aside class="profile">
        <div class="profile__content">
          <img src="images/image-jeremy.png"
               alt="Jeremy Robson"
               class="profile__img">
          <div class="profile__text">
            <p class="profile__report text-6">Report for</p>
            <h1 class="profile__name">Jeremy Robson</h1>
          </div>
        </div>

        <nav class="profile__nav"
             aria-label="Time period">
          <ul>
            <li><button type="button"
                      class="nav__btn text-5-rg"
                      data-period="daily"
                      aria-pressed="false">Daily</button></li>
            <li><button type="button"
                      class="nav__btn active text-5-rg"
                      data-period="weekly"
                      aria-pressed="false">Weekly</button></li>
            <li><button type="button"
                      class="nav__btn text-5-rg"
                      data-period="monthly"
                      aria-pressed="false">Monthly</button></li>
          </ul>
        </nav>

      </aside>
      <section class="cards-grid">
        <article class="card"
                 id="work">
          <div class="card-accent">
            <img src="images/icon-work.svg"
                 alt="">
          </div>
          <div class="card-body">
            <div class="card-body__top">
              <h2 class="card-category text-5-md">Work</h2>
              <button type="button"
                      class="card-menu"
                      aria-label="More options">•••</button>
            </div>
            <div class="card-body__bottom">
              <span class="card-current-hours">32hrs</span>
              <span class="card-previous-hours text-6">Last Week - 36hrs</span>
            </div>
          </div>
        </article>

        <article class="card"
                 id="play">
          <div class="card-accent">
            <img src="images/icon-play.svg"
                 alt="">
          </div>
          <div class="card-body">
            <div class="card-body__top">
              <h2 class="card-category text-5-md">Play</h2>
              <button type="button"
                      class="card-menu"
                      aria-label="More options">•••</button>
            </div>
            <div class="card-body__bottom">
              <span class="card-current-hours">10hrs</span>
              <span class="card-previous-hours text-6">Last Week - 8hrs</span>
            </div>
          </div>
        </article>

        <article class="card"
                 id="study">
          <div class="card-accent">
            <img src="images/icon-study.svg"
                 alt="">
          </div>
          <div class="card-body">
            <div class="card-body__top">
              <h2 class="card-category text-5-md">Study</h2>
              <button type="button"
                      class="card-menu"
                      aria-label="More options">•••</button>
            </div>
            <div class="card-body__bottom">
              <span class="card-current-hours">4hrs</span>
              <span class="card-previous-hours text-6">Last Week - 7hrs</span>
            </div>
          </div>
        </article>

        <article class="card"
                 id="exercise">
          <div class="card-accent">
            <img src="images/icon-exercise.svg"
                 alt="">
          </div>
          <div class="card-body">
            <div class="card-body__top">
              <h2 class="card-category text-5-md">Exercise</h2>
              <button type="button"
                      class="card-menu"
                      aria-label="More options">•••</button>
            </div>
            <div class="card-body__bottom">
              <span class="card-current-hours">4hrs</span>
              <span class="card-previous-hours text-6">Last Week - 5hrs</span>
            </div>
          </div>
        </article>

        <article class="card"
                 id="social">
          <div class="card-accent">
            <img src="images/icon-social.svg"
                 alt="">
          </div>
          <div class="card-body">
            <div class="card-body__top">
              <h2 class="card-category text-5-md">Social</h2>
              <button type="button"
                      class="card-menu"
                      aria-label="More options">•••</button>
            </div>
            <div class="card-body__bottom">
              <span class="card-current-hours">5hrs</span>
              <span class="card-previous-hours text-6">Last Week - 10hrs</span>
            </div>
          </div>
        </article>

        <article class="card"
                 id="self-care">
          <div class="card-accent">
            <img src="images/icon-self-care.svg"
                 alt="">
          </div>
          <div class="card-body">
            <div class="card-body__top">
              <h2 class="card-category text-5-md">Self Care</h2>
              <button type="button"
                      class="card-menu"
                      aria-label="More options">•••</button>
            </div>
            <div class="card-body__bottom">
              <span class="card-current-hours">2hrs</span>
              <span class="card-previous-hours text-6">Last Week - 2hrs</span>
            </div>
          </div>
        </article>

      </section>
    </div>
  </main>

  <script type="module"
          src="main.js"></script>

</body>

</html>
